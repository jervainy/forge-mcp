[package]
name = "forge-mcp"
version = "0.1.0"
edition = "2024"
description = "A workspace-scoped MCP server for shell and file operations."
license = "MIT"
repository = "https://github.com/jervainy/forge-mcp"

[dependencies]
anyhow = "1"
rmcp = { version = "3", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
