[package]
name = "forge-mcp"
version = "0.1.0"
edition = "2024"
description = "A from-scratch MCP server for workspace-scoped shell and file operations."
license = "MIT"
repository = "https://github.com/jervainy/forge-mcp"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
futures = "0.3"
globset = "0.4"
hmac = "0.12"
regex = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "time", "io-util", "io-std", "signal", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
