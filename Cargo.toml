[package]
name = "forge-mcp"
version = "0.1.0"
edition = "2024"
description = "A from-scratch MCP server for workspace-scoped shell and file operations."
license = "MIT"
repository = "https://github.com/jervainy/forge-mcp"

[dependencies]
anyhow = "1"
axum = "0.8"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "time", "io-util", "io-std", "signal", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
